url: https://www.okanbulut.com/mirtverse/

template:
  bootstrap: 5
  bslib:
    primary: "#2C5F8A"
  opengraph:
    image:
      src: man/figures/card.png
      alt: "mirtverse: From item responses to defensible decisions, with or without writing R code"

redirects:
  - ["articles/labs.html", "articles/teaching-labs.html"]

navbar:
  structure:
    left: [start, intro, reference, articles, aihub, book, cheatsheet, news]
    right: [search, github]
  components:
    start:
      text: Start here
      menu:
      - text: Students
        href: articles/for-students.html
      - text: Instructors
        href: articles/for-instructors.html
      - text: Testing programs
        href: articles/for-practitioners.html
      - text: Researchers
        href: articles/for-researchers.html
      - text: New to R
        href: articles/for-new-to-r.html
      - text: Curious about AI
        href: articles/ai-hub.html
      - text: -------
      - text: Try the live dashboard
        href: dashboard/sat12-demo.html
      - text: Gallery of figures and outputs
        href: articles/gallery.html
    aihub:
      text: AI Hub
      menu:
      - text: Start here
        href: articles/ai-hub.html
      - text: Machine learning for psychometricians
        href: articles/ai-translation.html
      - text: Reading list
        href: articles/ai-reading.html
      - text: One-day workshop kit
        href: articles/ai-workshop.html
      - text: "Book: AI in measurement"
        href: book/ml-lens.html
      - text: -------
      - text: AI tools in mirtverse
      - text: Write analysis code from plain language
        href: articles/mv-ask-guide.html
      - text: Generate and verify items
        href: reference/generate_items.html
      - text: Generate items from item models
        href: reference/item_model.html
      - text: Predict item difficulty from text
        href: reference/predict_difficulty.html
      - text: Train and check a scoring engine
        href: reference/train_scorer.html
      - text: Audit an AI component
        href: reference/ai_audit.html
    book:
      text: Book
      href: book/index.html
    cheatsheet:
      text: Cheat sheet
      href: cheatsheet/mirtverse-cheatsheet.pdf

articles:
- title: Start here
  desc: A short path for each kind of user.
  navbar: ~
  contents:
  - articles/for-students
  - articles/for-instructors
  - articles/for-practitioners
  - articles/for-researchers
  - articles/for-new-to-r
- title: Guides
  navbar: ~
  contents:
  - mirtverse
  - workbench
  - response-times
  - articles/mv-ask-guide
  - articles/dashboards
  - articles/mirtify
  - articles/assessment-pipeline
  - articles/gallery
- title: Teaching and learning
  navbar: Teaching and learning
  contents:
  - articles/teaching-labs
  - articles/course-map
  - articles/instructor-toolkit
  - articles/instructor-mcp
  - articles/glossary
- title: AI in measurement
  desc: >
    Artificial intelligence and machine learning for psychometricians. These
    articles are also in the AI Hub menu.
  contents:
  - articles/ai-hub
  - articles/ai-translation
  - articles/ai-reading
  - articles/ai-workshop

reference:
- title: Workbench
  desc: Point-and-click analysis with reproducible code.
  contents:
  - launch_workbench
- title: Scripts from plain language
  desc: Describe an analysis in words and get a complete, tested R script.
  contents:
  - mv_ask
  - mv_ask_setup
  - mv_plan
  - run_script
  - profile_data
- title: Coming from other IRT packages
  desc: Translate ltm, eRm, TAM and irtQ code into mirt code.
  contents:
  - mirtify
  - mirtify_crosswalk
- title: Assessment pipeline
  desc: >
    Take a test from response data to a technical report in stages, with
    checks and flags to consider before each next stage.
  contents:
  - mv_pipeline
  - set_blueprint
  - generate_items
  - review_packet
  - design_field_test
  - add_responses
  - calibrate
  - link_to_bank
  - bank_items
  - mv_bank
  - assemble_forms
  - simulate_cat
  - assemble_mst
  - set_cuts
  - item_map
  - score_open
  - score_persons
  - check_security
  - pipeline_report
  - monitor_bank
  - retire_items
  - flags
  - acknowledge
  - drop_items
  - mv_rules
- title: AI in measurement
  desc: >
    Run the language model features offline from recorded responses,
    describe items by their text and predict their difficulty, generate
    items from item models and calibrate their families, train and check an
    automated scoring engine, audit AI components and draft a validity
    argument, simulate respondents with a language model (experimental),
    and teaching datasets with item text, written answers, a
    field test of generated items and an AI-scored test.
  contents:
  - mv_llm_replay
  - item_features
  - predict_difficulty
  - item_model
  - generate_isomorphs
  - calibrate_families
  - train_scorer
  - predict.mv_scorer
  - agreement_report
  - ai_audit
  - validity_argument
  - simulate_llm_respondents
  - compare_synthetic
  - itemtext
  - essays
  - aigfield
  - aigfield_items
  - aiscored
  - aiscored_cr
- title: Choosing and understanding a model
  contents:
  - select_model
  - interpret
  - interpret_prompt
- title: Tidy outputs
  contents:
  - tidy_mirt
  - glance_mirt
  - augment_mirt
  - item_table
- title: Graphics
  contents:
  - starts_with("gg_")
  - autoplot.SingleGroupClass
  - theme_mirtverse
- title: Differential item functioning
  contents:
  - dif
- title: Item health cards and reports
  contents:
  - item_card
  - item_cards
  - mv_report
- title: Dashboards
  desc: Interactive results dashboards to share with people who do not use R.
  contents:
  - mv_dashboard
  - export_dashboard
- title: Response times
  contents:
  - fit_rt
  - sim_rt
- title: Teaching labs
  desc: Interactive tutorials for measurement courses.
  contents:
  - run_lab
  - lab_truth
  - certexam
  - numeracy
  - linking
  - catbank
  - openended
- title: Instructor toolkit
  desc: >
    Build labs on your own data, adapt the built-in labs and the book's
    chapters, swap datasets and check materials before class.
  contents:
  - new_course
  - course_materials
  - new_lab
  - copy_lab
  - lab_section_types
  - add_lab_section
  - swap_lab_data
  - lab_data
  - copy_chapter
  - copy_workshop
  - check_material
  - preview_lab
- title: AI assistant for instructors
  desc: Connect Claude or an OpenAI assistant to your course materials.
