  - gg_coverage
  - hexaco_real
  - hexaco_llm
  - hexaco_items
  - itemtext
  - essays
  - aigfield
  - aigfield_items
  - aiscored
  - aiscored_cr
- title: Knowledge graphs
  desc: >
    Describe what a test measures as a graph of concepts, their
    prerequisites and the items that measure them; check the graph for
    problems and draw it; turn it into a Q-matrix, a confirmatory mirt
    model or the mastery patterns its prerequisites allow. Examples with a simulated fractions test (with the
    true graph) and Tatsuoka's fraction subtraction data.
  contents:
  - mv_kg_build
  - as_mv_kg
  - mv_kg_check
  - tidy_mv_kg
  - gg_kg
  - mv_kg_qmatrix
  - mv_kg_model
  - mv_kg_irt
  - mv_kg_hierarchy
  - mv_kg_subset
  - fractions
  - fraction_subtraction
