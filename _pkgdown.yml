url: https://www.okanbulut.com/mirtverse/

template:
  bootstrap: 5
  bslib:
    primary: "#2C5F8A"

navbar:
  structure:
    left: [intro, reference, articles, labs, news]
    right: [search, github]
  components:
    labs:
      text: Teaching labs
      href: articles/labs.html

articles:
- title: Guides
  navbar: ~
  contents:
  - mirtverse
  - articles/mv-ask-guide
  - workbench
  - articles/dashboards
  - response-times
  - articles/labs
  - articles/teaching-labs
  - articles/mirtify

reference:
- title: Workbench
  desc: Point-and-click analysis with reproducible code.
  contents:
  - launch_workbench
- title: Scripts from plain language
  desc: Describe an analysis in words and get a complete, tested R script.
  contents:
  - mv_ask
  - mv_ask_setup
  - mv_plan
  - run_script
  - profile_data
- title: Coming from other IRT packages
  desc: Translate ltm, eRm, TAM and irtQ code into mirt code.
  contents:
  - mirtify
  - mirtify_crosswalk
- title: Assessment pipeline
  desc: >
    Take a test from response data to a technical report in stages, with
    checks and flags to consider before each next stage.
  contents:
  - mv_pipeline
  - add_responses
  - calibrate
  - pipeline_report
  - flags
  - acknowledge
  - drop_items
  - mv_rules
- title: Choosing and understanding a model
  contents:
  - select_model
  - interpret
  - interpret_prompt
- title: Tidy outputs
  contents:
  - tidy_mirt
  - glance_mirt
  - augment_mirt
  - item_table
- title: Graphics
  contents:
  - starts_with("gg_")
  - autoplot.SingleGroupClass
  - theme_mirtverse
- title: Differential item functioning
  contents:
  - dif
- title: Item health cards and reports
  contents:
  - item_card
  - item_cards
  - mv_report
- title: Dashboards
  desc: Interactive results dashboards to share with people who do not use R.
  contents:
  - mv_dashboard
  - export_dashboard
- title: Response times
  contents:
  - fit_rt
