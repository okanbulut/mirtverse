bookdown::gitbook:
  css: style.css
  split_by: chapter
  config:
    toc:
      collapse: section
      before: |
        <li><a href="./">IRT with mirt and mirtverse</a></li>
      after: |
        <li><a href="https://www.okanbulut.com/mirtverse/">mirtverse website</a></li>
        <li><a href="https://github.com/okanbulut/mirtverse">Source on GitHub</a></li>
    edit:
      link: https://github.com/okanbulut/mirtverse/edit/main/book/%s
      text: "Suggest an edit"
    download: ["pdf", "epub"]
    sharing: null
    info: false
bookdown::pdf_book:
  latex_engine: xelatex
  citation_package: default
  toc_depth: 2
  keep_tex: false
  includes:
    in_header: latex/preamble.tex
    before_body: latex/before_body.tex
  pandoc_args: ["--lua-filter=latex/boxes.lua"]
bookdown::epub_book:
  cover_image: cover/cover.png
  stylesheet: epub.css
  metadata: epub-metadata.xml
