# Builds the pkgdown site and publishes it to the gh-pages branch.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::bookdown, local::.
          needs: website
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Install LaTeX for the PDF edition of the book
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern fonts-texgyre fonts-dejavu-core
      - name: Build the online book into the site
        run: |
          # PDF and EPUB first, then the HTML book that links to them.
          bookdown::render_book("index.Rmd", "bookdown::pdf_book", quiet = TRUE)
          bookdown::render_book("index.Rmd", "bookdown::epub_book", quiet = TRUE)
          bookdown::render_book("index.Rmd", "bookdown::gitbook", quiet = TRUE)
          unlink("../docs/book", recursive = TRUE)
          file.copy("_book", "../docs", recursive = TRUE)
          file.rename("../docs/_book", "../docs/book")
        shell: Rscript {0}
        working-directory: book

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
